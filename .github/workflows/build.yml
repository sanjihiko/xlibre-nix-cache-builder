name: Build XLibre and publish to Cachix

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_inputs:
        description: Update flake inputs to latest instead of using the pinned lock
        type: boolean
        default: false
  schedule:
    # weekly scheduled rebuild
    - cron: '0 6 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: sanjihiko-xlibre
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Lock or update flake inputs
        run: |
          # If triggered manually with update_inputs = false, preserve the lockfile.
          # Otherwise (scheduled runs, pushes, or manual runs with update_inputs = true),
          # fetch the latest inputs to keep the cache up to date.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update_inputs }}" = "false" ]; then
            echo "Preserving pinned flake.lock..."
            nix flake lock
          else
            echo "Updating flake inputs..."
            nix flake update
          fi

      - name: Build all XLibre packages
        run: |
          set +e
          failed=()
          for pkg in $(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::Building $pkg"
            if ! nix build ".#packages.x86_64-linux.$pkg" -L; then
              failed+=("$pkg")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::warning::Failed to build: ${failed[*]}"
          fi

      # cachix-action auto-pushes everything built above (watch-store on by default)

      - name: Commit flake.lock if changed
        run: |
          if ! git diff --quiet -- flake.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "chore: update flake.lock"
            git push
          fi
